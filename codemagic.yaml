workflows:
  seif-tv-android:
    name: Seif TV Android APK
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Extract Seif TV project
        script: |
          unzip -q SeifTV-Android-Source.zip

      - name: Prepare Gradle
        script: |
          cd SeifTV-FINAL-Android-Project
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK
        script: |
          cd SeifTV-FINAL-Android-Project
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - SeifTV-FINAL-Android-Project/app/build/outputs/apk/debug/*.apk
