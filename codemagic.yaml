workflows:
  seif-tv-android:
    name: Seif TV Android APK
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Extract Seif TV source
        script: |
          rm -rf SeifTV
          mkdir SeifTV
          unzip -q SeifTV-Android-Source.zip -d SeifTV
      - name: Generate Gradle wrapper
        script: |
          cd SeifTV
          gradle wrapper --gradle-version 8.7
      - name: Build debug APK
        script: |
          cd SeifTV
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
    artifacts:
      - SeifTV/app/build/outputs/apk/debug/*.apk
